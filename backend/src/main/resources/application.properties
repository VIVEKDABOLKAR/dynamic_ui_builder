spring.application.name=demo
server.port=8080

# =========================================================
# Database Connection
# =========================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/yms_dynamic_ui1}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# JPA / Hibernate
# =========================================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# =========================================================
# Security
# =========================================================
logging.level.org.springframework.security=DEBUG

# =========================================================
# JWT
# =========================================================
app.jwt.secret=${JWT_SECRET:local-development-secret-change-me}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# =========================================================
# Rate Limiting
# =========================================================
app.rate-limit.login.capacity=${LOGIN_RATE_LIMIT_CAPACITY:5}
app.rate-limit.login.refill-minutes=${LOGIN_RATE_LIMIT_REFILL_MINUTES:3}

# =========================================================
# Logging
# =========================================================
spring.output.ansi.enabled=ALWAYS
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr([%5level]) %clr(%-40.40logger{39}){cyan} %clr(-){faint} %msg%n

logging.level.root=info
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

# =========================================================
# Error Response
# =========================================================
spring.web.error.include-message=always

# =========================================================
# Cache
# =========================================================
spring.cache.type=caffeine
spring.cache.cache-names=pageConfigurations
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=10m