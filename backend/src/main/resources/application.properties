```properties
spring.application.name=demo
server.port=8080

# =========================================================
# Database Connection
# =========================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/yms_dynamic_ui2?connectionAttributes=program_name:my-spring-backend}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# JPA / Hibernate
# =========================================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# Do NOT print SQL queries in console
spring.jpa.show-sql=false

# Do NOT format SQL because SQL logging is disabled
spring.jpa.properties.hibernate.format_sql=false

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# =========================================================
# JWT
# =========================================================
app.jwt.secret=${JWT_SECRET:3b7e9f2a1c4d8e6b0a5f3c2d9e7b4a1f6c8d2e5b9f0a3c7d1e4b8f2a6c0d9e3}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}


# =========================================================
# Rate Limiting
# =========================================================
app.rate-limit.login.capacity=${LOGIN_RATE_LIMIT_CAPACITY:5}
app.rate-limit.login.refill-minutes=${LOGIN_RATE_LIMIT_REFILL_MINUTES:3}


# =========================================================
# Logging
# =========================================================

# Enable ANSI colors in console
spring.output.ansi.enabled=ALWAYS

# Custom informative console log format
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr([%5level]) %clr(%-40.40logger{39}){cyan} %clr(-){faint} %msg%n

# Default logging levels
logging.level.root=info
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF


# Include the actual exception message (e.g. "You do not have permission to
# access: gate.checkin") in error responses so the frontend's toast shows
# something useful instead of a generic message. Applies to both the new
# permission checks and the existing facility-route-access 403s.
spring.web.error.include-message=always

```
